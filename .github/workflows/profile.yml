name: Generate terminal profile

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "profile.config.json"
      - "package.json"
      - ".github/workflows/profile.yml"
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run generate

      - name: Commit generated profile
        run: |
          if git diff --quiet -- assets/terminal-dark.svg assets/terminal-light.svg; then
            echo "Profile is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/terminal-dark.svg assets/terminal-light.svg
          git commit -m "chore: refresh terminal profile"
          git push